<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png" type="images/png">
</head>

<!-- Body -->
<body class="place-page">

    <!-- Header -->
    <header>
        <!-- Navegation Bar -->
    <div class="navegation">
        <nav>
            <div class="logo-header">
                <a href="index.html"><img src="images/logo.png" alt="HBnB Logo" class="logo"></a>
                <a href="index.html" id="home-link">Home</a>
                <a href="login.html" id="login-link">Login</a>
            </div>
        </nav>
    </div>
    </header>

    <!-- Main -->
    <main>
        <!-- Place Details Section -->
        <section id="place-details" class="place-details">
            <div class="place-info">
                <h2 class="place-name"><strong>Beautiful Beach House</strong></h2>
                <p class="place-host">Host: Franco Reyes</p>
                <p class="place-price">Price per night: $150</p>
                <p class="place-description">Description: A biutiful house in the beach.</p>
                <p class="place-amenities">Amenities: Wi-Fi, Bath, Gym</p>
            </div>
        </section>

        <!-- Review Section -->
        <section id="reviews">
            <h3>Reviews:</h3>
            <div class="review-card">
                <p class="review-coment">Great place!!</p>
                <p class="review-user">Fabrizzio Oviedo</p>
                <p class="review">★★★★★</p>
            </div>
            <div class="review-card">
                <p class="review-coment">it's awful.</p>
                <p class="review-user">Jonathan Perez</p>
                <p class="review">★☆☆☆☆</p>
            </div>
        </section>

        <section id="add-review">
            <h2>Add a Review</h2>
            <!-- This form can be shown conditionally if the user is logged in -->
            <div class="review-card">
                <form id="review-form" class="add-review">
                    <label for="review-text">Review:</label>
                    <textarea id="review-text" name="review-text" required></textarea>
                    
                    <button type="submit">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="copyrigth">
            <p>All rights reserved &copy; 2025</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
