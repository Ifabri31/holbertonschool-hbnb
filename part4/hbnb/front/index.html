<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png" type="images/png">
</head>

<!-- Body -->
<body class="index-page">

    <!-- Header -->
    <header>
        <!-- Navegation Bar -->
        <div class="navegation">
            <nav>
                <div class="logo-header">
                    <a href="index.html"><img src="images/logo.png" alt="HBnB Logo" class="logo"></a>
                    <a href="login.html" id="login-link">Login</a>
                    <a href="place.html">Places</a>
                    <a href="add_review.html">Reviews</a>
                </div>
            </nav>
        </div>

    </header>

    <!-- Main -->
    <main>
        <div id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="300">300</option>
                <option value="500">500</option>
                <option value="All">All</option>
            </select>
        </div>
        <section id="places-list">
            <!-- List of places will be populated dynamically -->
            <div class="place-card" id="place-card">
                <h3 class="place-name">Beautiful Beach House</h3>
                <p class="place-price">Price per night: $150</p>
                <button class="details-button">View Details</button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="copyrigth">
            <p>All rights reserved &copy; 2025</p>
        </div>
     </footer>

     <!-- Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
